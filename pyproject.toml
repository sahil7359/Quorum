[project]
name = "quorum"
version = "0.1.0"
description = "A supervisor agent that reviews pull requests with citation-backed, human-approved findings."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# why: dependencies are added phase by phase, each with an ADR, so that every entry here is
#      one I can explain and point at a decision record for.
#      alt: declare the whole stack up front (fewer resolver runs, but a dependency list
#      nobody can account for line by line)
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.9",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sse-starlette>=3.4.8",
    "structlog>=24.4",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "eval", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "tests"]

# ---------------------------------------------------------------------------
# mypy — strict, no exceptions carved out for our own code
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["app", "eval", "tests"]

[[tool.mypy.overrides]]
# why: third-party packages without shipped stubs. Narrow, named, and re-reviewed whenever a
#      dependency is added — never a blanket ignore_missing_imports = true at the top level.
#      alt: global ignore_missing_imports (one line, but silently hides real typing gaps)
module = []
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# why: timeout-method=thread rather than the signal default -- a hang stuck in a C extension
#      or blocking syscall won't respond to a signal, but a watcher thread can still fire and
#      report which test it caught mid-hang instead of the whole job silently running for hours.
addopts = "-q --strict-markers --strict-config --timeout=60 --timeout-method=thread"
asyncio_mode = "auto"
markers = [
    "integration: requires an external service (Postgres, Ollama, network)",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["app"]
branch = true

# ---------------------------------------------------------------------------
# import-linter — layer boundaries are enforced, not conventional
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
# why: needed so that external packages (httpx, sqlalchemy, ...) appear in the graph and can
#      be named in forbidden contracts. Without it, "domain must not import httpx" silently
#      passes because httpx is not a node in the graph.
#      alt: leave it off and rely on the AST fitness test alone (one mechanism, not two)
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interface -> application -> domain"
type = "layers"
layers = ["app.interface", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "Layers: interface -> infrastructure -> domain"
type = "layers"
layers = ["app.interface", "app.infrastructure", "app.domain"]

# why: application and infrastructure are siblings, not a stack. Expressed as two forbidden
#      contracts rather than one multi-module layer line because that syntax has moved
#      between import-linter versions and I want a contract that reads unambiguously.
#      alt: a single layers contract with both modules on one line (terser, version-fragile)
[[tool.importlinter.contracts]]
name = "Application does not import infrastructure"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infrastructure"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not import application"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.application"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no framework, driver or client imports"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "httpx",
    "sqlalchemy",
    "psycopg",
    "langgraph",
    "structlog",
    "mcp",
    "fastembed",
    "fastapi",
    "pydantic",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Application is framework-light"
# why: LangGraph is deliberately absent from this list -- the graph IS the application logic.
#      See docs/adr/0002-langgraph-in-application.md for what that trade costs.
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "httpx",
    "sqlalchemy",
    "psycopg",
    "mcp",
    "fastembed",
    "fastapi",
]
